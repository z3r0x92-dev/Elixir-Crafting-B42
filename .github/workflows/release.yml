name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Build 42 package
        run: python3 tools/validate.py

      - name: Build mod archive
        shell: bash
        run: |
          mkdir -p dist/ElixirCraftB42
          cp -R src/42 dist/ElixirCraftB42/42
          cp -R src/common dist/ElixirCraftB42/common
          cp src/README.txt dist/ElixirCraftB42/README.txt
          cd dist
          zip -r "ElixirCraftB42-${{ github.ref_name }}.zip" ElixirCraftB42

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElixirCraftB42-${{ github.ref_name }}
          path: dist/ElixirCraftB42-${{ github.ref_name }}.zip

      - name: Attach archive to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ElixirCraftB42-${{ github.ref_name }}.zip
          generate_release_notes: true
