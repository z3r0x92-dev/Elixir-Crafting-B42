name: Validate mod

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Build 42 package
        run: python3 tools/validate.py

      - name: Compile-check Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          find src/common/media/lua -name '*.lua' -print0 |
            xargs -0 -n1 luac5.4 -p
